<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Thank You | NevTech</title>

  <!-- Google Fonts (Inter + Source Sans 3 as TeleNeo fallbacks) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Pro (place files in vendor/fontawesome/) -->
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">

  <!-- Shared stylesheet -->
  <link rel="stylesheet" href="styles.css?v=20260729-2">

  <style>
    :root{--teal:#14B8A6;--teal-dark:#0F766E;--dark:#1F2937;--muted:#D5F8F3;--white:#fff}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif}
    body{background:#0F766E;color:var(--white)}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    .thankyou-hero{min-height:calc(100vh - 112px);background:linear-gradient(135deg,#0F766E 0%,#14B8A6 100%);position:relative;overflow:hidden}
    .thankyou-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.15),transparent 34%),linear-gradient(125deg,rgba(15,23,42,.68),rgba(15,23,42,.12));pointer-events:none}
    .thankyou-hero__layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,.82fr);min-height:calc(100vh - 112px);align-items:stretch}
    .thankyou-hero__content{padding:64px clamp(38px,7vw,120px);display:flex;flex-direction:column;justify-content:space-between;color:#fff}
    .logo{display:inline-block;width:190px}
    .logo__img{width:100%;height:auto}
    .thankyou-hero__heading{color:#fff;font-size:clamp(48px,5.2vw,78px);line-height:1.02;letter-spacing:-.045em;margin:42px 0 24px}
    .thankyou-hero__heading--demibold{font-weight:800}
    .thankyou-hero__heading--regular{font-weight:500}
    .thankyou-hero__body{max-width:700px;color:#EAFFFC;font-size:20px;line-height:1.65;margin:0}
    .thankyou-hero__assist-label{font-size:13px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#9CF8ED;margin:44px 0 14px}
    .contact-stack{display:grid;gap:12px}
    .contact-row{display:flex;align-items:center;gap:12px;color:#fff;font-size:17px;font-weight:700;width:max-content}
    .contact-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26)}
    .thankyou-hero__media{position:relative;min-height:620px;overflow:hidden}
    .thankyou-hero__photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
    .thankyou-hero__media-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,118,110,.28),rgba(15,23,42,.08))}
    .partners{background:#F2F2F2}
    .partners__inner{width:min(1180px,calc(100% - 48px));margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:28px 0}
    .partners__logo{max-height:56px;max-width:240px;object-fit:contain}
    @media(max-width:980px){.thankyou-hero__layout{grid-template-columns:1fr}.thankyou-hero__content{min-height:680px;padding:52px 34px}.thankyou-hero__media{min-height:420px}.thankyou-hero__heading{font-size:52px}}
    @media(max-width:620px){.thankyou-hero__content{padding:38px 22px;min-height:620px}.logo{width:160px}.thankyou-hero__heading{font-size:42px}.thankyou-hero__body{font-size:17px}.thankyou-hero__media{min-height:330px}.contact-row{font-size:15px}.partners__inner{gap:28px}.partners__logo{max-width:42%;max-height:44px}}
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K8QQ43QV"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!-- =======================================================
       THANK YOU HERO
       Layout: content LEFT - decorative photo RIGHT
       (mirror of main hero)
  ========================================================== -->
  <section class="thankyou-hero">
    <div class="thankyou-hero__layout">

      <!-- Left column &mdash; content -->
      <div class="thankyou-hero__content">

        <a href="/" class="logo" aria-label="NevTech &mdash; home">
          <img src="src/NevTech_logo_reversed.png" alt="NevTech" class="logo__img">
        </a>

        <div>
          <h1 class="thankyou-hero__heading">
            <span class="thankyou-hero__heading--demibold">Thank You!</span><br>
            <span class="thankyou-hero__heading--regular">Your Request Has Been Received</span>
          </h1>
          <p class="thankyou-hero__body">
            You're one step closer to putting our AI Receptionist Service to work for your business.<br>
            A member of our team will be in touch shortly with the next steps and account setup information.
          </p>
        </div>

        <div>
          <p class="thankyou-hero__assist-label">Need immediate assistance?</p>
          <div class="contact-stack">
            <a href="mailto:Cody@NevTech.io" class="contact-row contact-row--light">
              <span class="contact-icon contact-icon--light" aria-hidden="true">
                <i class="fa-regular fa-envelope"></i>
              </span>
              Cody@NevTech.io
            </a>
            <a href="tel:+13175089493" class="contact-row contact-row--light">
              <span class="contact-icon contact-icon--light" aria-hidden="true">
                <i class="fa-regular fa-phone"></i>
              </span>
              (317) 508-9493
            </a>
          </div>
        </div>

      </div><!-- /thankyou-hero__content -->

      <!-- Right column &mdash; image -->
      <div class="thankyou-hero__media">
        <img src="src/thankyou-image.png" alt="" class="thankyou-hero__photo" aria-hidden="true">
        <div class="thankyou-hero__media-overlay" aria-hidden="true"></div>
      </div>

    </div><!-- /thankyou-hero__layout -->
  </section>


  <!-- =======================================================
       PARTNERS BAR
  ========================================================== -->
  <footer class="partners partners--left" aria-label="Partner logos">
    <div class="container partners__inner">
      <img src="src/KORE_Logo_RGB_72dpi_Full-Color_1200px.png" alt="KORE" class="partners__logo">
      <img src="src/tmobile.png" alt="T-Mobile for Business" class="partners__logo">
    </div>
  </footer>

</body>
</html>
