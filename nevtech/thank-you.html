  <!-- =======================================================
       THANK YOU HERO
       Layout: content LEFT - decorative photo RIGHT
       (mirror of main hero)
  ========================================================== -->
  <section class="thankyou-hero">
    <div class="thankyou-hero__layout">

      <!-- Left column &mdash; content -->
      <div class="thankyou-hero__content">

        <a href="/" class="logo" aria-label="NevTech &mdash; home">
          <img src="src/NevTech_logo_reversed.png" alt="NevTech" class="logo__img">
        </a>

        <div>
          <h1 class="thankyou-hero__heading">
            <span class="thankyou-hero__heading--demibold">Thank You!</span><br>
            <span class="thankyou-hero__heading--regular">Your Request Has Been Received</span>
          </h1>
          <p class="thankyou-hero__body">
            You're one step closer to putting our AI Receptionist Service to work for your business.<br>
            A member of our team will be in touch shortly with the next steps and account setup information.
          </p>
        </div>

        <div>
          <p class="thankyou-hero__assist-label">Need immediate assistance?</p>
          <div class="contact-stack">
            <a href="mailto:Cody@NevTech.io" class="contact-row contact-row--light">
              <span class="contact-icon contact-icon--light" aria-hidden="true">
                <i class="fa-regular fa-envelope"></i>
              </span>
              Cody@NevTech.io
            </a>
            <a href="tel:+13175089493" class="contact-row contact-row--light">
              <span class="contact-icon contact-icon--light" aria-hidden="true">
                <i class="fa-regular fa-phone"></i>
              </span>
              (317) 508-9493
            </a>
          </div>
        </div>

      </div><!-- /thankyou-hero__content -->

      <!-- Right column &mdash; image -->
      <div class="thankyou-hero__media">
        <img src="src/thankyou-image.png" alt="" class="thankyou-hero__photo" aria-hidden="true">
        <div class="thankyou-hero__media-overlay" aria-hidden="true"></div>
      </div>

    </div><!-- /thankyou-hero__layout -->
  </section>


  <!-- =======================================================
       PARTNERS BAR
  ========================================================== -->
  <footer class="partners partners--left" aria-label="Partner logos">
    <div class="container partners__inner">
      <img src="src/KORE_Logo_RGB_72dpi_Full-Color_1200px.png" alt="KORE" class="partners__logo">
      <img src="src/tmobile.png" alt="T-Mobile for Business" class="partners__logo">
