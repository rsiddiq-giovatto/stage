    <div class="thankyou-hero__overlay" aria-hidden="true"></div>
    <div class="thankyou-hero__layout">

      <div class="thankyou-hero__content">

        <a href="/" class="logo" aria-label="Klutch Tech Solutions &mdash; home">

            <strong>Thank You!</strong><br>

          </h1>
          <p class="thankyou-hero__body">
            Your submission has been received. A member of our team will reach out shortly to discuss how we can support your workforce mobility needs.

        </div>

        <div>

            <a href="mailto:info@klutchtechsolutions.com" class="contact-row contact-row--light">

                <i class="fa-regular fa-envelope"></i>
              </span>

            </a>
            <a href="tel:+15165328010" class="contact-row contact-row--light">
              <span class="contact-icon contact-icon--light" aria-hidden="true">
                <i class="fa-regular fa-phone"></i>
              </span>
              516-532-8010
            </a>
          </div>
        </div>

      </div>

        <img src="src/thank-you-image.png" alt="" class="thankyou-hero__photo">
      </div>

    </div>
